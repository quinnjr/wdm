[package]
name = "wdm-protocol"
description = "Wayland protocol bindings for wdm greeters"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
client = ["wayland-client"]
server = ["wayland-server"]

[dependencies]
wayland-scanner.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }
# The scanner's generated interfaces name wayland_backend paths directly, so
# this is a real dependency even though no source file imports it.
wayland-backend = "0.3"
