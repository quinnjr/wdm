[package]
name = "wdm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calloop = { version = "0.14.4", features = ["signals"] }
env_logger = "0.11.11"
fontdue = "0.9.4"
freedesktop-desktop-entry = "0.8.1"
libc = "0.2.189"
log.workspace = true
pam-client2 = { version = "0.5.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_drm", "backend_egl", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib", "backend_gbm"] }
thiserror.workspace = true
toml = "1.1.4"
# smithay emits its diagnostics through `tracing`, not `log`: every atomic
# commit rejection, format negotiation failure and EGL import error in
# backend/drm and backend/egl is a `tracing::warn!`. Without a subscriber all of
# them are discarded, which on the handoff — the path with the least hardware
# coverage — removes the only record of why a commit failed. `tracing-log` is
# deliberately *off*: env_logger is already the global `log` logger, so bridging
# would either fight it for the slot or duplicate every record.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "smallvec", "std"] }
uzers = "0.12.2"
wdm-protocol = { workspace = true, features = ["server"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

# Packaging for .deb (cargo-deb) and .rpm (cargo-generate-rpm). Both are driven
# from here rather than from a debian/ directory and a .spec, because neither
# dpkg-buildpackage nor rpmbuild runs on the machine this is developed on, and
# packaging nobody can build is packaging nobody checks.
#
# Paths match the Arch package exactly, /usr/lib/wdm included. Fedora would
# normally put helper binaries in /usr/libexec, but greeter.command defaults to
# /usr/lib/wdm/wdm-greeter, and a per-distribution default is a configuration
# file that is wrong on two distributions out of three.
[package.metadata.deb]
name = "wdm"
maintainer = "Joseph R. Quinn <quinn.josephr@protonmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """
A Wayland display manager that is its own compositor. It binds DRM/KMS through
libseat, hosts the greeter as an ordinary Wayland client, and hands the display
to the user's session at login, with no kiosk compositor and no X server.
"""
section = "x11"
priority = "optional"
# Alternatives rather than a bare virtual: apt cannot choose between several
# providers of one, so `Depends: wdm-greeter-implementation` would be
# uninstallable. First named is what apt takes by default.
# `passwd` provides usermod, which postinst calls; it is Priority: required, so
# it is never actually absent, but the rpm side declares shadow-utils for the
# same call and two packages disagreeing about whether a dependency is worth
# stating is how one of them later gets it wrong. getent is glibc's and needs no
# entry.
depends = "libc6, libinput10, libseat1, libsystemd0, libdrm2, libgbm1, libegl1, libxkbcommon0, libpam0g, systemd, passwd, wdm-greeter | wdm-gtk-greeter | wdm-webkit-greeter"
conf-files = ["/etc/wdm/wdm.toml", "/etc/pam.d/wdm"]
maintainer-scripts = "../../packaging/deb"
assets = [
    ["../../target/release/wdm", "usr/bin/", "755"],
    ["../../packaging/wdm.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/pam.d-wdm.debian", "etc/pam.d/wdm", "644"],
    ["../../packaging/wdm.toml.example", "etc/wdm/wdm.toml", "644"],
    ["../../packaging/wdm.sysusers", "usr/lib/sysusers.d/wdm.conf", "644"],
    ["../../packaging/wdm.tmpfiles", "usr/lib/tmpfiles.d/wdm.conf", "644"],
    ["../../packaging/wdm.1", "usr/share/man/man1/wdm.1", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/wdm/CHANGELOG.md", "644"],
]

[package.metadata.generate-rpm]
name = "wdm"
summary = "Wayland display manager that is its own compositor"
license = "MIT"
# Fedora's systemd ships file triggers for sysusers.d and tmpfiles.d, so on a
# fresh install dropping the files in is enough. The scriptlet below is for the
# other case: an upgrade whose tmpfiles entries changed. The triggers fire on
# the files, not on their contents, so without it an upgraded machine keeps the
# old /var/lib/wdm ownership and lacks /var/empty until the next boot — the
# greeter-owned state directory this release stops creating would survive the
# upgrade that fixes it. Guarded and non-fatal: a container image built with
# rpm and no systemd must still install.
# Failures are reported rather than discarded, the same as the deb's postinst
# and for the same reason: these calls decide whether wdm can start at all, and
# swallowing them leaves an administrator with a display manager that fails for
# no visible reason. Non-fatal all the same — an install must not abort.
post_install_script = '''
if [ -x /usr/bin/systemd-sysusers ]; then
    /usr/bin/systemd-sysusers /usr/lib/sysusers.d/wdm.conf \
        || echo "wdm: creating the wdm account failed; wdm.service will not start" >&2
fi
if [ -x /usr/bin/systemd-tmpfiles ]; then
    /usr/bin/systemd-tmpfiles --create /usr/lib/tmpfiles.d/wdm.conf \
        || echo "wdm: creating /var/lib/wdm and /var/empty failed; the greeter will not spawn" >&2
fi
# Moves the greeter's home off /var/lib/wdm on a machine that installed 0.1.x.
# Why, and why both guards, is written out once in packaging/deb/postinst.
# Absolute paths, as for the systemd- calls above: a scriptlet runs with a PATH
# rpm chose, not the administrator's.
if [ "$(/usr/bin/getent passwd wdm | cut -d: -f6)" = /var/lib/wdm ]; then
    if [ -d /var/empty ]; then
        /usr/sbin/usermod -d /var/empty wdm \
            || echo "wdm: could not move the wdm account's home to /var/empty" >&2
    else
        echo "wdm: /var/empty does not exist; leaving the wdm account's home at /var/lib/wdm" >&2
    fi
fi
# The flip side of config = "noreplace" below: a customised stack is kept, so a
# future security fix to the wdm PAM stack lands beside it and never applies
# until someone merges it by hand.
if [ -f /etc/pam.d/wdm.rpmnew ]; then
    echo "wdm: /etc/pam.d/wdm.rpmnew was left beside your PAM stack; it may contain authentication changes that are not in effect until merged" >&2
fi
'''
assets = [
    { source = "target/release/wdm", dest = "/usr/bin/wdm", mode = "755" },
    { source = "packaging/wdm.service", dest = "/usr/lib/systemd/system/wdm.service", mode = "644" },
    # `config = "noreplace"` rather than `config = true`: plain %config makes rpm
    # overwrite a locally modified file on upgrade and leave the admin's version
    # as .rpmsave, which would silently revert a customised vt, greeter.command
    # or a PAM stack adapted for fingerprint or smartcard. dpkg conffiles and
    # pacman's backup= both keep the local file, and %config(noreplace) is what
    # Fedora's guidelines require for /etc files that are not regenerated.
    { source = "packaging/pam.d-wdm.fedora", dest = "/etc/pam.d/wdm", mode = "644", config = "noreplace" },
    { source = "packaging/wdm.toml.example", dest = "/etc/wdm/wdm.toml", mode = "644", config = "noreplace" },
    { source = "packaging/wdm.sysusers", dest = "/usr/lib/sysusers.d/wdm.conf", mode = "644" },
    { source = "packaging/wdm.tmpfiles", dest = "/usr/lib/tmpfiles.d/wdm.conf", mode = "644" },
    { source = "packaging/wdm.1", dest = "/usr/share/man/man1/wdm.1", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/wdm/LICENSE", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/wdm/CHANGELOG.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
libinput = "*"
libseat = "*"
systemd-libs = "*"
libdrm = "*"
mesa-libgbm = "*"
mesa-libEGL = "*"
libxkbcommon = "*"
pam = "*"
# The post-install scriptlet calls usermod. getent comes from glibc-common and
# is not what this entry is for.
shadow-utils = "*"
# dnf can choose between providers of a virtual, so this one stays as it is in
# the Arch package.
wdm-greeter-implementation = "*"
