[package]
name = "wdm-webkit-greeter"
description = "WebKitGTK greeter for wdm, with themes written in HTML, CSS and JavaScript"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wdm-greeter-client.workspace = true
wdm-protocol.workspace = true
gtk4.workspace = true
gtk4-layer-shell.workspace = true
env_logger.workspace = true
log.workspace = true

webkit6 = "0.6"
# Only ever used to *emit* JavaScript literals. Values reaching the page come
# from PAM and from the account database, so escaping them by hand is a code
# injection waiting to happen.
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

# See crates/wdm/Cargo.toml. The default theme is data, not documentation: the
# greeter refuses to start without the theme it was pointed at.
[package.metadata.deb]
name = "wdm-webkit-greeter"
maintainer = "Joseph R. Quinn <quinn.josephr@protonmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = "WebKitGTK greeter for wdm, with themes written in HTML, CSS and JavaScript."
section = "x11"
priority = "optional"
depends = "libc6, libgtk-4-1, libgtk4-layer-shell0, libwebkitgtk-6.0-4"
provides = "wdm-greeter-implementation"
assets = [
    ["../../target/release/wdm-webkit-greeter", "usr/lib/wdm/wdm-webkit-greeter", "755"],
    ["themes/default/*", "usr/share/wdm/webkit-greeter/themes/default/", "644"],
    # Three entries for the arch theme, not one glob: `themes/arch/*` does not
    # descend, so vendor/ would be dropped and the theme would install as an
    # unstyled page with every icon a missing-glyph box. src/ and build.sh are
    # deliberately absent — they regenerate vendor/ and are not read at runtime.
    ["themes/arch/index.html", "usr/share/wdm/webkit-greeter/themes/arch/", "644"],
    ["themes/arch/style.css", "usr/share/wdm/webkit-greeter/themes/arch/", "644"],
    ["themes/arch/theme.js", "usr/share/wdm/webkit-greeter/themes/arch/", "644"],
    # Carries the Font Awesome and Tailwind licences as well as the assets;
    # CC BY 4.0 and the OFL both require them to travel with the files.
    ["themes/arch/vendor/*", "usr/share/wdm/webkit-greeter/themes/arch/vendor/", "644"],
]

[package.metadata.generate-rpm]
name = "wdm-webkit-greeter"
summary = "WebKitGTK greeter for wdm, themed in HTML, CSS and JavaScript"
license = "MIT"
provides = { wdm-greeter-implementation = "*" }
assets = [
    { source = "target/release/wdm-webkit-greeter", dest = "/usr/lib/wdm/wdm-webkit-greeter", mode = "755" },
    { source = "crates/wdm-webkit-greeter/themes/default/*", dest = "/usr/share/wdm/webkit-greeter/themes/default/", mode = "644" },
    # See the deb assets above: the glob does not descend, so vendor/ is named
    # separately or the theme installs unstyled.
    { source = "crates/wdm-webkit-greeter/themes/arch/index.html", dest = "/usr/share/wdm/webkit-greeter/themes/arch/", mode = "644" },
    { source = "crates/wdm-webkit-greeter/themes/arch/style.css", dest = "/usr/share/wdm/webkit-greeter/themes/arch/", mode = "644" },
    { source = "crates/wdm-webkit-greeter/themes/arch/theme.js", dest = "/usr/share/wdm/webkit-greeter/themes/arch/", mode = "644" },
    { source = "crates/wdm-webkit-greeter/themes/arch/vendor/*", dest = "/usr/share/wdm/webkit-greeter/themes/arch/vendor/", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/wdm-webkit-greeter/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
gtk4-layer-shell = "*"
"webkitgtk6.0" = "*"
