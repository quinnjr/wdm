[workspace]
resolver = "3"
members = [
    "crates/wdm-protocol",
    "crates/wdm",
    "crates/wdm-greeter",
    "crates/wdm-greeter-client",
    "crates/wdm-gtk-greeter",
    "crates/wdm-webkit-greeter",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wdm-protocol = { path = "crates/wdm-protocol", version = "0.1.0" }
wdm-greeter-client = { path = "crates/wdm-greeter-client", version = "0.1.2" }

wayland-server = "0.31"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-protocols = "0.32"
wayland-protocols-wlr = "0.3"

thiserror = "2"
log = "0.4"

# Shared by both toolkit greeters. GTK owns the Wayland connection, so they
# bind wdm_greeter_v1 on GDK's rather than opening one of their own.
# v4_10 gates gtk::Accessible, which webkit6 needs to declare its widget's
# interfaces. GTK itself has had it since 4.10, so the floor this sets is one
# every supported distribution cleared years ago.
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
env_logger = "0.11"
